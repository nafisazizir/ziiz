name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Docs (frontmatter, nav coverage, internal links)
        run: pnpm docs:check

      # docs:check rebuilt the registry; the committed output must match.
      - name: Generated files are current
        run: |
          git diff --exit-code -- apps/www/public/r apps/www/registry.json apps/www/components/examples/index.ts apps/www/lib/component-nav.ts \
            || { echo "::error::Generated registry files are stale. Run 'pnpm --filter www registry:build' and commit the result."; exit 1; }

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Compiles every MDX file, builds the registry and previews, and
      # prerenders every docs, component and blog page.
      - name: Build
        run: pnpm build
